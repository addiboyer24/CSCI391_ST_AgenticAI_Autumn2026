<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 968" width="850" height="968" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>Module 09 one-page guide: Single-Agent Patterns</title>
<rect width="100%" height="100%" fill="#fff"/>
<rect width="850" height="147" fill="#70002e"/>
<text x="40" y="42" fill="#ED8B00" font-size="13" font-weight="700" letter-spacing="2">CSCI 391 · MODULE 09 · ONE-PAGE LECTURE GUIDE</text>
<text x="40" y="82" fill="#fff" font-size="30" font-weight="800">Single-Agent Patterns</text>
<text x="40" y="120" fill="#f1dbe4" font-size="16" font-style="italic">Not more capable — more organized.</text>
<text x="40" y="177" fill="#555" font-size="13"><tspan font-weight="700" fill="#70002e">Part III · Architecture and Patterns</tspan>   ·   Week 9   ·   Read: Caldwell, The Agentic AI Bible, Ch. 10</text>
<rect x="40" y="203" width="770" height="104" rx="10" fill="#efe8d4"/>
<text x="60" y="231" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">OPENING CASE</text>
<text x="60" y="255" fill="#1f1a1c" font-size="14">Returns, refunds, product questions: fine at low volume. At scale, context growth plus tool-set complexity plus a new</text>
<text x="60" y="275" fill="#1f1a1c" font-size="14">request distribution produced unverified refunds, skipped steps, and 3–4× repeated tool calls. The fix wasn&#x27;t a better</text>
<text x="60" y="295" fill="#1f1a1c" font-size="14">model; it was structure.</text>
<rect x="40" y="331" width="6" height="62" fill="#ED8B00"/>
<text x="62" y="353" fill="#70002e" font-size="20" font-weight="700">Start with a flat ReAct loop. Add a pattern only when production evidence</text>
<text x="62" y="380" fill="#70002e" font-size="20" font-weight="700">shows the specific failure mode it prevents.</text>
<text x="40" y="425" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">KEY FRAMEWORK</text>
<text x="40" y="447" fill="#1f1a1c" font-size="16" font-weight="700">Core single-agent patterns</text>
<circle cx="51" cy="476" r="11" fill="#70002e"/>
<text x="51" y="481" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1</text>
<text x="70" y="481" fill="#1f1a1c" font-size="13.5">Router → executor: classify, then act</text>
<circle cx="51" cy="504" r="11" fill="#b8432f"/>
<text x="51" y="509" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">2</text>
<text x="70" y="509" fill="#1f1a1c" font-size="13.5">Validator wrapper: check outputs before release</text>
<circle cx="51" cy="532" r="11" fill="#c77700"/>
<text x="51" y="537" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">3</text>
<text x="70" y="537" fill="#1f1a1c" font-size="13.5">Step machine: explicit states and guarded</text>
<text x="70" y="556" fill="#1f1a1c" font-size="13.5">transitions</text>
<circle cx="51" cy="579" r="11" fill="#2d6a87"/>
<text x="51" y="584" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">4</text>
<text x="70" y="584" fill="#1f1a1c" font-size="13.5">Escalation path: explicit, coded, and tested</text>
<text x="440.0" y="425" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">YOU SHOULD BE ABLE TO</text>
<path d="M442.0,453 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="457" fill="#1f1a1c" font-size="13.5">Choose among router, validator, step-machine, and</text>
<text x="466.0" y="476" fill="#1f1a1c" font-size="13.5">scratchpad patterns</text>
<path d="M442.0,502 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="506" fill="#1f1a1c" font-size="13.5">Keep policy and tool authority outside model prose</text>
<path d="M442.0,532 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="536" fill="#1f1a1c" font-size="13.5">Combine patterns — most production agents use two or</text>
<text x="466.0" y="555" fill="#1f1a1c" font-size="13.5">three</text>
<path d="M442.0,581 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="585" fill="#1f1a1c" font-size="13.5">Know when a single agent is no longer enough</text>
<rect x="40" y="627" width="770" height="175" rx="10" fill="#fff6e8" stroke="#f0c98a"/>
<rect x="40" y="627" width="7" height="175" rx="3" fill="#ED8B00"/>
<text x="62" y="655" fill="#9a5a00" font-size="13" font-weight="800" letter-spacing="1.8">ENTERPRISE LENS · ADDISON BOYER</text>
<circle cx="68" cy="675" r="3.5" fill="#ED8B00"/>
<text x="80" y="679" fill="#1f1a1c" font-size="13.5">A validator should be the minimum needed to catch failure modes you&#x27;ve actually seen — not a wish list. Every</text>
<text x="80" y="698" fill="#1f1a1c" font-size="13.5">check costs latency.</text>
<circle cx="68" cy="723" r="3.5" fill="#ED8B00"/>
<text x="80" y="727" fill="#1f1a1c" font-size="13.5">If an escalation path isn&#x27;t in the code and covered by a test, it doesn&#x27;t exist.</text>
<circle cx="68" cy="752" r="3.5" fill="#ED8B00"/>
<text x="80" y="756" fill="#1f1a1c" font-size="13.5">Behavior that &#x27;emerges at scale&#x27; is still a design bug. Load-test with a realistic request distribution, not ten</text>
<text x="80" y="775" fill="#1f1a1c" font-size="13.5">hand-picked prompts.</text>
<text x="40" y="832" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">DISCUSS</text>
<text x="40" y="852" fill="#1f1a1c" font-size="14">→  What does the validator know that the executor doesn&#x27;t?</text>
<text x="40" y="878" fill="#1f1a1c" font-size="14">→  At what point is a move to multiple agents defensible?</text>
<line x1="40" y1="922" x2="810" y2="922" stroke="#ddd"/>
<text x="40" y="946" fill="#777" font-size="11.5">Concepts after Caldwell, The Agentic AI Bible, Ch. 10. Case framing, synthesis, and enterprise lens: Addison Boyer.</text>
</svg>