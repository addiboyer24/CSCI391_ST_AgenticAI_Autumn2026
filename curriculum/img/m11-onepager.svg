<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 1000" width="850" height="1000" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>Module 11 one-page guide: Human-in-the-Loop &amp; Human-on-the-Loop</title>
<rect width="100%" height="100%" fill="#fff"/>
<rect width="850" height="147" fill="#70002e"/>
<text x="40" y="42" fill="#ED8B00" font-size="13" font-weight="700" letter-spacing="2">CSCI 391 · MODULE 11 · ONE-PAGE LECTURE GUIDE</text>
<text x="40" y="82" fill="#fff" font-size="30" font-weight="800">Human-in-the-Loop &amp; Human-on-the-Loop</text>
<text x="40" y="120" fill="#f1dbe4" font-size="16" font-style="italic">Place oversight by the risk of the action — not the difficulty of the task.</text>
<text x="40" y="177" fill="#555" font-size="13"><tspan font-weight="700" fill="#70002e">Part III · Architecture and Patterns</tspan>   ·   Weeks 10–12   ·   Read: Caldwell, The Agentic AI Bible, Ch. 12</text>
<rect x="40" y="203" width="770" height="104" rx="10" fill="#efe8d4"/>
<text x="60" y="231" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">OPENING CASE</text>
<text x="60" y="255" fill="#1f1a1c" font-size="14">Approve, decline, or escalate transaction flags. Autonomous mode: confident and wrong on the hard 15%. Confidence-</text>
<text x="60" y="275" fill="#1f1a1c" font-size="14">gated mode: the agent handles the clear cases and sends a brief explanation for the rest to an analyst who decides in</text>
<text x="60" y="295" fill="#1f1a1c" font-size="14">one click.</text>
<rect x="40" y="331" width="6" height="62" fill="#ED8B00"/>
<text x="62" y="353" fill="#70002e" font-size="20" font-weight="700">Oversight is a risk calculation: reversibility of the action, how often the</text>
<text x="62" y="380" fill="#70002e" font-size="20" font-weight="700">agent leaves its reliable range, and the cost of the human&#x27;s latency.</text>
<text x="40" y="425" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">KEY FRAMEWORK</text>
<text x="40" y="447" fill="#1f1a1c" font-size="16" font-weight="700">Two oversight models</text>
<circle cx="51" cy="476" r="11" fill="#70002e"/>
<text x="51" y="481" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1</text>
<text x="70" y="481" fill="#1f1a1c" font-size="13.5">HITL — agent pauses; a human must respond to</text>
<text x="70" y="500" fill="#1f1a1c" font-size="13.5">continue</text>
<circle cx="51" cy="523" r="11" fill="#b8432f"/>
<text x="51" y="528" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">2</text>
<text x="70" y="528" fill="#1f1a1c" font-size="13.5">HOTL — agent proceeds; a human observes and can</text>
<text x="70" y="547" fill="#1f1a1c" font-size="13.5">intervene</text>
<circle cx="51" cy="570" r="11" fill="#c77700"/>
<text x="51" y="575" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">3</text>
<text x="70" y="575" fill="#1f1a1c" font-size="13.5">Intervene before irreversible actions</text>
<circle cx="51" cy="598" r="11" fill="#2d6a87"/>
<text x="51" y="603" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">4</text>
<text x="70" y="603" fill="#1f1a1c" font-size="13.5">Intervene when confidence falls below a measured</text>
<text x="70" y="622" fill="#1f1a1c" font-size="13.5">threshold</text>
<text x="440.0" y="425" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">YOU SHOULD BE ABLE TO</text>
<path d="M442.0,453 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="457" fill="#1f1a1c" font-size="13.5">Distinguish human-in-the-loop from human-on-the-loop</text>
<path d="M442.0,483 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="487" fill="#1f1a1c" font-size="13.5">Place intervention points before irreversible</text>
<text x="466.0" y="506" fill="#1f1a1c" font-size="13.5">actions</text>
<path d="M442.0,532 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="536" fill="#1f1a1c" font-size="13.5">Calibrate confidence thresholds and build</text>
<text x="466.0" y="555" fill="#1f1a1c" font-size="13.5">asynchronous review queues</text>
<path d="M442.0,581 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="585" fill="#1f1a1c" font-size="13.5">Measure whether oversight adds value or just adds</text>
<text x="466.0" y="604" fill="#1f1a1c" font-size="13.5">friction</text>
<rect x="40" y="659" width="770" height="175" rx="10" fill="#fff6e8" stroke="#f0c98a"/>
<rect x="40" y="659" width="7" height="175" rx="3" fill="#ED8B00"/>
<text x="62" y="687" fill="#9a5a00" font-size="13" font-weight="800" letter-spacing="1.8">ENTERPRISE LENS · ADDISON BOYER</text>
<circle cx="68" cy="707" r="3.5" fill="#ED8B00"/>
<text x="80" y="711" fill="#1f1a1c" font-size="13.5">Design from the reviewer&#x27;s chair: what do I need to know to decide well, and what do I need to be able to do?</text>
<text x="80" y="730" fill="#1f1a1c" font-size="13.5">Usually it&#x27;s a summary and three buttons.</text>
<circle cx="68" cy="755" r="3.5" fill="#ED8B00"/>
<text x="80" y="759" fill="#1f1a1c" font-size="13.5">The HITL threshold is a tunable parameter. Track reviewer agreement rates and move it with evidence.</text>
<circle cx="68" cy="784" r="3.5" fill="#ED8B00"/>
<text x="80" y="788" fill="#1f1a1c" font-size="13.5">Paused runs must survive restarts. Keep run state in a relational database or Redis, and verify state hasn&#x27;t</text>
<text x="80" y="807" fill="#1f1a1c" font-size="13.5">changed before resuming after approval.</text>
<text x="40" y="864" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">DISCUSS</text>
<text x="40" y="884" fill="#1f1a1c" font-size="14">→  What makes an approval meaningful rather than ceremonial?</text>
<text x="40" y="910" fill="#1f1a1c" font-size="14">→  How does a run resume when the human and the agent work on different timelines?</text>
<line x1="40" y1="954" x2="810" y2="954" stroke="#ddd"/>
<text x="40" y="978" fill="#777" font-size="11.5">Concepts after Caldwell, The Agentic AI Bible, Ch. 12. Case framing, synthesis, and enterprise lens: Addison Boyer.</text>
</svg>