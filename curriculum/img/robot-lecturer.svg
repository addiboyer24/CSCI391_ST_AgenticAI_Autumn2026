<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" width="420" height="520">
  <title>Encore robot lecturer</title>
  <defs>
    <radialGradient id="helm" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9dee6"/></radialGradient>
    <radialGradient id="visor" cx="45%" cy="40%" r="75%"><stop offset="0" stop-color="#1c2233"/><stop offset="1" stop-color="#05070d"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="hood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d92b2b"/><stop offset="1" stop-color="#a51717"/></linearGradient>
  </defs>
  <!-- body / hoodie -->
  <path d="M95 520 C95 400 130 345 210 345 C290 345 325 400 325 520Z" fill="url(#hood)"/>
  <path d="M150 352 C170 395 250 395 270 352" fill="none" stroke="#8c1010" stroke-width="10" stroke-linecap="round"/>
  <path d="M186 380 l-6 70 M234 380 l6 70" stroke="#f3f3f3" stroke-width="5" stroke-linecap="round"/>
  <rect x="190" y="440" width="40" height="30" rx="6" fill="#8c1010"/>
  <!-- pointer arm (gesturing) -->
  <path d="M310 420 C350 400 365 370 372 340" fill="none" stroke="url(#hood)" stroke-width="40" stroke-linecap="round"/>
  <circle cx="374" cy="328" r="22" fill="#fff" stroke="#cfd5de" stroke-width="3"/>
  <!-- antenna -->
  <line x1="210" y1="70" x2="210" y2="30" stroke="#cfd5de" stroke-width="6"/>
  <circle cx="210" cy="24" r="11" fill="#5ff3ff" filter="url(#glow)"/>
  <!-- headphones band -->
  <path d="M95 190 C95 80 325 80 325 190" fill="none" stroke="#2b2b33" stroke-width="12"/>
  <!-- helmet -->
  <ellipse cx="210" cy="200" rx="120" ry="125" fill="url(#helm)" stroke="#c7ccd6" stroke-width="3"/>
  <!-- ear cups -->
  <rect x="70" y="160" width="40" height="80" rx="18" fill="#ff8a00" stroke="#c96500" stroke-width="4"/>
  <rect x="310" y="160" width="40" height="80" rx="18" fill="#ff8a00" stroke="#c96500" stroke-width="4"/>
  <!-- mic -->
  <path d="M100 235 C110 285 150 300 175 292" fill="none" stroke="#2b2b33" stroke-width="5"/>
  <circle cx="178" cy="291" r="7" fill="#2b2b33"/>
  <!-- visor -->
  <rect x="120" y="135" width="180" height="140" rx="62" fill="url(#visor)"/>
  <!-- eyes: happy arcs -->
  <g id="eyes" fill="none" stroke="#5ff3ff" stroke-width="9" stroke-linecap="round" filter="url(#glow)">
    <path d="M155 200 q18 -22 36 0"/>
    <path d="M229 200 q18 -22 36 0"/>
  </g>
  <!-- mouth: three states for lip-sync (closed / mid / open); a renderer shows one at a time -->
  <g filter="url(#glow)">
    <path id="mouth-closed" d="M185 238 q25 18 50 0" fill="none" stroke="#5ff3ff" stroke-width="7" stroke-linecap="round"/>
    <path id="mouth-mid" d="M185 236 q25 26 50 0 q-25 8 -50 0Z" fill="#5ff3ff" opacity="0" />
    <path id="mouth-open" d="M182 234 q28 38 56 0 q-28 10 -56 0Z" fill="#5ff3ff" opacity="0"/>
  </g>
  <!-- cheek blush -->
  <circle cx="148" cy="228" r="7" fill="#5ff3ff" opacity=".25"/>
  <circle cx="272" cy="228" r="7" fill="#5ff3ff" opacity=".25"/>
</svg>
