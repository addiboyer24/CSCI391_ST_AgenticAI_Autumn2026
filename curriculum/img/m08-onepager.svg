<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 967" width="850" height="967" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>Module 08 one-page guide: Model Context Protocol (MCP)</title>
<rect width="100%" height="100%" fill="#fff"/>
<rect width="850" height="147" fill="#70002e"/>
<text x="40" y="42" fill="#ED8B00" font-size="13" font-weight="700" letter-spacing="2">CSCI 391 · MODULE 08 · ONE-PAGE LECTURE GUIDE</text>
<text x="40" y="82" fill="#fff" font-size="30" font-weight="800">Model Context Protocol (MCP)</text>
<text x="40" y="120" fill="#f1dbe4" font-size="16" font-style="italic">MCP standardizes the envelope — not the contents.</text>
<text x="40" y="177" fill="#555" font-size="13"><tspan font-weight="700" fill="#70002e">Part II · Core Capabilities</tspan>   ·   Week 8   ·   Read: Caldwell, The Agentic AI Bible, Ch. 9</text>
<rect x="40" y="203" width="770" height="84" rx="10" fill="#efe8d4"/>
<text x="60" y="231" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">OPENING CASE</text>
<text x="60" y="255" fill="#1f1a1c" font-size="14">Before MCP, LangChain, AutoGen, and OpenAI each had their own tool-connectivity format — three years of bespoke</text>
<text x="60" y="275" fill="#1f1a1c" font-size="14">abstractions. MCP fixed the envelope. But an MCP-compatible server still has to understand Salesforce&#x27;s domain model.</text>
<rect x="40" y="311" width="6" height="62" fill="#ED8B00"/>
<text x="62" y="333" fill="#70002e" font-size="20" font-weight="700">MCP is to agent-tool discovery what HTTP is to document retrieval: a shared</text>
<text x="62" y="360" fill="#70002e" font-size="20" font-weight="700">envelope, not shared meaning.</text>
<text x="40" y="405" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">KEY FRAMEWORK</text>
<text x="40" y="427" fill="#1f1a1c" font-size="16" font-weight="700">MCP building blocks</text>
<circle cx="51" cy="456" r="11" fill="#70002e"/>
<text x="51" y="461" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1</text>
<text x="70" y="461" fill="#1f1a1c" font-size="13.5">Host · client · server roles</text>
<circle cx="51" cy="484" r="11" fill="#b8432f"/>
<text x="51" y="489" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">2</text>
<text x="70" y="489" fill="#1f1a1c" font-size="13.5">Initialize &amp; negotiate capabilities</text>
<circle cx="51" cy="512" r="11" fill="#c77700"/>
<text x="51" y="517" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">3</text>
<text x="70" y="517" fill="#1f1a1c" font-size="13.5">Tools (call), resources (read), prompts (templates)</text>
<circle cx="51" cy="540" r="11" fill="#2d6a87"/>
<text x="51" y="545" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">4</text>
<text x="70" y="545" fill="#1f1a1c" font-size="13.5">Transports: stdio and Streamable HTTP</text>
<text x="440.0" y="405" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">YOU SHOULD BE ABLE TO</text>
<path d="M442.0,433 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="437" fill="#1f1a1c" font-size="13.5">Explain JSON-RPC requests, responses, and</text>
<text x="466.0" y="456" fill="#1f1a1c" font-size="13.5">notifications</text>
<path d="M442.0,482 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="486" fill="#1f1a1c" font-size="13.5">Distinguish tools, resources, and prompts</text>
<path d="M442.0,512 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="516" fill="#1f1a1c" font-size="13.5">Compare stdio and Streamable HTTP transports</text>
<path d="M442.0,542 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="546" fill="#1f1a1c" font-size="13.5">Apply a production security model: auth, scoping,</text>
<text x="466.0" y="565" fill="#1f1a1c" font-size="13.5">audit logs</text>
<rect x="40" y="607" width="770" height="194" rx="10" fill="#fff6e8" stroke="#f0c98a"/>
<rect x="40" y="607" width="7" height="194" rx="3" fill="#ED8B00"/>
<text x="62" y="635" fill="#9a5a00" font-size="13" font-weight="800" letter-spacing="1.8">ENTERPRISE LENS · ADDISON BOYER</text>
<circle cx="68" cy="655" r="3.5" fill="#ED8B00"/>
<text x="80" y="659" fill="#1f1a1c" font-size="13.5">Audit logging on every MCP tool invocation is what separates a production-grade server from a dev server. It is</text>
<text x="80" y="678" fill="#1f1a1c" font-size="13.5">your forensic record and your debugging source.</text>
<circle cx="68" cy="703" r="3.5" fill="#ED8B00"/>
<text x="80" y="707" fill="#1f1a1c" font-size="13.5">Transports move bytes; they don&#x27;t authorize anything. Enforce permissions in the host and the server, not by</text>
<text x="80" y="726" fill="#1f1a1c" font-size="13.5">trusting the transport.</text>
<circle cx="68" cy="751" r="3.5" fill="#ED8B00"/>
<text x="80" y="755" fill="#1f1a1c" font-size="13.5">Only discover and enable capabilities the current user and task are allowed to use. A long tool catalog is an</text>
<text x="80" y="774" fill="#1f1a1c" font-size="13.5">attack surface.</text>
<text x="40" y="831" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">DISCUSS</text>
<text x="40" y="851" fill="#1f1a1c" font-size="14">→  What changes when tools are discovered at runtime instead of compiled in?</text>
<text x="40" y="877" fill="#1f1a1c" font-size="14">→  Which controls belong at the host, the transport, and the server?</text>
<line x1="40" y1="921" x2="810" y2="921" stroke="#ddd"/>
<text x="40" y="945" fill="#777" font-size="11.5">Concepts after Caldwell, The Agentic AI Bible, Ch. 9. Case framing, synthesis, and enterprise lens: Addison Boyer.</text>
</svg>