<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 987" width="850" height="987" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>Module 10 one-page guide: Multi-Agent Systems &amp; Shared Infrastructure</title>
<rect width="100%" height="100%" fill="#fff"/>
<rect width="850" height="147" fill="#70002e"/>
<text x="40" y="42" fill="#ED8B00" font-size="13" font-weight="700" letter-spacing="2">CSCI 391 · MODULE 10 · ONE-PAGE LECTURE GUIDE</text>
<text x="40" y="82" fill="#fff" font-size="30" font-weight="800">Multi-Agent Systems &amp; Shared Infrastructure</text>
<text x="40" y="120" fill="#f1dbe4" font-size="16" font-style="italic">Agents talking to each other isn&#x27;t an architecture. Typed messages and shared state are.</text>
<text x="40" y="177" fill="#555" font-size="13"><tspan font-weight="700" fill="#70002e">Part III · Architecture and Patterns</tspan>   ·   Week 9   ·   Read: Caldwell, The Agentic AI Bible, Ch. 11</text>
<rect x="40" y="203" width="770" height="104" rx="10" fill="#efe8d4"/>
<text x="60" y="231" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">OPENING CASE</text>
<text x="60" y="255" fill="#1f1a1c" font-size="14">A mid-sized legal-tech company built a staged pipeline. On large document sets and big precedent databases, the facts-</text>
<text x="60" y="275" fill="#1f1a1c" font-size="14">to-precedent relationship needed understanding the extraction step couldn&#x27;t produce up front — and mismatched schemas</text>
<text x="60" y="295" fill="#1f1a1c" font-size="14">between stages compounded the failure.</text>
<rect x="40" y="331" width="6" height="62" fill="#ED8B00"/>
<text x="62" y="353" fill="#70002e" font-size="20" font-weight="700">Multiple agents multiply specialization and coordination risk. Shared state,</text>
<text x="62" y="380" fill="#70002e" font-size="20" font-weight="700">typed messages, and recovery matter more than role-play.</text>
<text x="40" y="425" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">KEY FRAMEWORK</text>
<text x="40" y="447" fill="#1f1a1c" font-size="16" font-weight="700">Shared infrastructure</text>
<circle cx="51" cy="476" r="11" fill="#70002e"/>
<text x="51" y="481" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">1</text>
<text x="70" y="481" fill="#1f1a1c" font-size="13.5">Shared state with locking or optimistic concurrency</text>
<circle cx="51" cy="504" r="11" fill="#b8432f"/>
<text x="51" y="509" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">2</text>
<text x="70" y="509" fill="#1f1a1c" font-size="13.5">Typed, versioned, validated inter-agent messages</text>
<circle cx="51" cy="532" r="11" fill="#c77700"/>
<text x="51" y="537" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">3</text>
<text x="70" y="537" fill="#1f1a1c" font-size="13.5">Idempotent task results (first writer wins)</text>
<circle cx="51" cy="560" r="11" fill="#2d6a87"/>
<text x="51" y="565" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">4</text>
<text x="70" y="565" fill="#1f1a1c" font-size="13.5">Bounded fan-out and explicit ownership</text>
<text x="440.0" y="425" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">YOU SHOULD BE ABLE TO</text>
<path d="M442.0,453 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="457" fill="#1f1a1c" font-size="13.5">Compare supervisor-worker, pipeline, parallel, and</text>
<text x="466.0" y="476" fill="#1f1a1c" font-size="13.5">hierarchical patterns</text>
<path d="M442.0,502 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="506" fill="#1f1a1c" font-size="13.5">Design typed message contracts between agents</text>
<path d="M442.0,532 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="536" fill="#1f1a1c" font-size="13.5">Prevent lost updates with locks, SETNX, or</text>
<text x="466.0" y="555" fill="#1f1a1c" font-size="13.5">optimistic concurrency</text>
<path d="M442.0,581 l5,5 l10,-11" fill="none" stroke="#3f7a55" stroke-width="3" stroke-linecap="round"/>
<text x="466.0" y="585" fill="#1f1a1c" font-size="13.5">Recover from partial failure and duplicate execution</text>
<rect x="40" y="627" width="770" height="194" rx="10" fill="#fff6e8" stroke="#f0c98a"/>
<rect x="40" y="627" width="7" height="194" rx="3" fill="#ED8B00"/>
<text x="62" y="655" fill="#9a5a00" font-size="13" font-weight="800" letter-spacing="1.8">ENTERPRISE LENS · ADDISON BOYER</text>
<circle cx="68" cy="675" r="3.5" fill="#ED8B00"/>
<text x="80" y="679" fill="#1f1a1c" font-size="13.5">Mismatched schemas between stages are the most common source of pipeline failures I see. Version every message</text>
<text x="80" y="698" fill="#1f1a1c" font-size="13.5">contract.</text>
<circle cx="68" cy="723" r="3.5" fill="#ED8B00"/>
<text x="80" y="727" fill="#1f1a1c" font-size="13.5">Most production hierarchies stabilize at two levels — one supervisor, several workers. Deeper trees are usually a</text>
<text x="80" y="746" fill="#1f1a1c" font-size="13.5">smell.</text>
<circle cx="68" cy="771" r="3.5" fill="#ED8B00"/>
<text x="80" y="775" fill="#1f1a1c" font-size="13.5">Use atomic operations (Redis SETNX) so that a retried worker can&#x27;t overwrite a task another worker already</text>
<text x="80" y="794" fill="#1f1a1c" font-size="13.5">completed.</text>
<text x="40" y="851" fill="#70002e" font-size="13" font-weight="800" letter-spacing="1.8">DISCUSS</text>
<text x="40" y="871" fill="#1f1a1c" font-size="14">→  How do you tell productive disagreement from unbounded chatter?</text>
<text x="40" y="897" fill="#1f1a1c" font-size="14">→  What is the source of truth when agents observe different states?</text>
<line x1="40" y1="941" x2="810" y2="941" stroke="#ddd"/>
<text x="40" y="965" fill="#777" font-size="11.5">Concepts after Caldwell, The Agentic AI Bible, Ch. 11. Case framing, synthesis, and enterprise lens: Addison Boyer.</text>
</svg>